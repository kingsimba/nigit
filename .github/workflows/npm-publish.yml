# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Main Project
        uses: actions/checkout@v2
        with:
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: "nigit"
      - name: Checkout Other Projects 1
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/express-typescript-mocha-vscode"
          path: "express-typescript-mocha-vscode"
      - name: Checkout Other Projects 2
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/json-script"
          path: "json-script"
      - name: Checkout Other Projects 3
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/nc-geo"
          path: "ncgeo"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: nigit/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd nigit
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd nigit
          pnpm run clean
          pnpm run build

      - name: Test
        run: |
          cd nigit
          pnpm test
        env:
          CI: true

      - name: Publish Npm Package
        run: |
          cd nigit
          pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
