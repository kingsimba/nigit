# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Main Project
        uses: actions/checkout@v2
        with:
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: "nigit"
      - name: Checkout Other Projects 1
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/express-typescript-mocha-vscode"
          path: "express-typescript-mocha-vscode"
      - name: Checkout Other Projects 2
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/json-script"
          path: "json-script"
      - name: Checkout Other Projects 3
        uses: actions/checkout@v2
        with:
          repository: "kingsimba/nc-geo"
          path: "ncgeo"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: nigit/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd nigit
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd nigit
          pnpm run clean
          pnpm run build

      - name: Test
        run: |
          cd nigit
          pnpm test
        env:
          CI: true
